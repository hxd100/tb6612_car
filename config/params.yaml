car_bridge:
  ros__parameters:
    port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    baud: 115200

    # 机械参数（和 my-bot/description/robot_core.xacro 一致）
    wheel_radius: 0.05
    wheel_separation: 0.35

    # 标定：轮子转 1 米，编码器累计多少个计数（counts/10ms 的积分总和）
    # 用 tools/calibrate.py 实测得到后再改这里
    ticks_per_meter: 6500.0

    # 限幅
    max_linear: 0.40
    max_angular: 1.5
    max_counts: 40.0

    # 安全
    cmd_timeout: 0.4

    # 频率
    control_rate: 20.0
    odom_rate: 30.0

    # 方向（左右电机镜像安装）
    # dir_invert_*    : 启动时给下位机发 DIRL/DIRR=1，电机+编码器一起翻（首选）
    # wheel_invert_*  : 在 ROS 侧同时翻指令和反馈，效果等价（备选）
    # invert_*        : 只翻指令，会让里程计符号错，别用
    invert_left: false
    invert_right: false
    wheel_invert_left: false
    wheel_invert_right: false
    dir_invert_left: false
    dir_invert_right: true      # 本车实测：右轮 +指令时物理上往后转

    # closed_loop: L=/R= 走 STM32 的 PID（推荐）
    # open_loop:   TESTL/TESTR 直接给占空比（极性没修好前的临时方案）
    control_mode: closed_loop
    open_loop_deadband: 45.0

    dry_run: false
    publish_tf: true
    odom_frame: odom
    base_frame: base_link
